<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Midnight Sparkle Pursuit - Lateral Fixed</title>
<!-- [Los estilos CSS van aquí (Parte 2)] -->
</head>
<body>

    <!-- Pantalla de Inicio (Necesaria para desbloquear el audio en móviles) -->
    <div id="start-screen">
        <h1 style="font-size: 26px; margin-bottom: 10px; color: #00ffff;">MIDNIGHT SPARKLE</h1>
        <p style="font-size: 14px; padding: 0 20px; color: #a3a3c2;">Observa la persecución mágica en el espacio profundo</p>
        <button class="start-btn" onclick="startGame()">Comenzar Huida</button>
    </div>

    <!-- Interfaz de datos del juego (Muestra metros y segundos) -->
    <div id="ui-layer">
        <div>DISTANCIA: <span id="distance">8.0</span> m</div>
        <div>TIEMPO: <span id="timer">0</span>s / 60s</div>
    </div>

    <!-- Controles de Flechas Superiores para desplazar la cámara -->
    <div id="directional-controls">
        <button class="nav-btn" onclick="moveCamera('left')">←</button>
        <button class="nav-btn" onclick="moveCamera('down')">↓</button>
        <button class="nav-btn" onclick="moveCamera('up')">↑</button>
        <button class="nav-btn" onclick="moveCamera('right')">→</button>
    </div>

    <!-- Botón de Rayo Inferior para ganar velocidad -->
    <button id="speed-btn" onclick="useSpeedBoost()">⚡</button>

    <!-- Contenedor donde Three.js dibuja el universo 3D -->
    <div id="canvas-container"></div>

    <!-- Capa del Jumpscare -->
    <div id="jumpscare-screen">
        <img id="jumpscare-image" src="scary.png" alt="Jumpscare">
        <button class="restart-btn" onclick="location.reload()">Reintentar</button>
    </div>

    <!-- Pantalla de Victoria -->
    <div id="win-screen">
        <h1>¡LOGRASTE ESCAPAR!</h1>
        <p style="font-size: 16px; color: #fff; margin-bottom: 20px;">Midnight Sparkle no pudo alcanzarte.</p>
        <button class="start-btn" onclick="location.reload()">Jugar de nuevo</button>
    </div>

    <!-- Reproductores de Audio nativos -->
    <audio id="bg-music" src="back.mp3" loop></audio>
    <audio id="jump-music" src="jump.mp3" loop></audio>

    <!-- Librerías de gráficos 3D desde servidores CDN seguros -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
<!-- [El código JavaScript de programación va aquí (Partes 3, 4 y 5)] -->
</body>
</html>
<style>
    body, html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #02000A;
        font-family: sans-serif;
        user-select: none;
        width: 100vw;
        height: 100vh;
    }

    #canvas-container {
        width: 100vw;
        height: 100vh;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
    }

    #start-screen, #win-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle, #1a0033 0%, #020005 100%);
        z-index: 50;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #00ffff;
        text-align: center;
    }

    #win-screen {
        z-index: 60;
        display: none;
        color: #00ffcc;
    }

    .start-btn {
        padding: 12px 30px;
        background: linear-gradient(45deg, #7b00ff, #00d2ff);
        border: 2px solid #00ffff;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 25px;
        box-shadow: 0 0 15px #00ffff;
        text-transform: uppercase;
        margin-top: 20px;
    }

    #ui-layer {
        position: absolute;
        top: 15px;
        right: 15px;
        color: #00ffff;
        font-size: 16px;
        z-index: 10;
        text-shadow: 1px 1px 2px #000;
        pointer-events: none;
        display: none;
        text-align: right;
    }

    #directional-controls {
        position: absolute;
        top: 15px;
        left: 15px;
        z-index: 10;
        display: none;
        gap: 8px;
    }

    .nav-btn {
        width: 42px;
        height: 42px;
        background: rgba(0, 0, 0, 0.75);
        border: 1px solid #00ffff;
        color: #00ffff;
        font-size: 18px;
        cursor: pointer;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #speed-btn {
        position: absolute;
        bottom: 35px;
        left: 50%;
        transform: translateX(-50%);
        width: 75px;
        height: 75px;
        background: linear-gradient(45deg, #ffcc00, #ff6600);
        border: 2px solid #ffcc00;
        color: white;
        font-size: 30px;
        cursor: pointer;
        z-index: 10;
        border-radius: 50%;
        box-shadow: 0 0 15px #ffcc00;
        display: none;
        align-items: center;
        justify-content: center;
    }

    #jumpscare-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #000;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
    }

    #jumpscare-image {
        width: 90vw;
        height: 90vw;
        max-width: 550px;
        max-height: 550px;
        object-fit: contain;
    }

    .restart-btn {
        margin-top: 25px;
        padding: 12px 35px;
        background: linear-gradient(45deg, #ff0055, #990022);
        border: 2px solid #ff0055;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 20px;
        text-transform: uppercase;
        box-shadow: 0 0 10px #ff0055;
    }
</style>
<script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x02000a, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimizado para pantallas táctiles
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    const bgMusic = document.getElementById('bg-music');
    const jumpMusic = document.getElementById('jump-music');

    // Ángulo de visión lateral fijo (Vista de perfil de los corredores)
    let baseCamX = 6, baseCamY = 1.2, baseCamZ = 3;
    camera.position.set(baseCamX, baseCamY, baseCamZ);
    camera.lookAt(0, -0.2, 1.5);

    // Render de partículas de estrellas de la galaxia
    const starsGeometry = new THREE.BufferGeometry();
    const starsCount = 1500;
    const starPositions = new Float32Array(starsCount * 3);
    
    for(let i = 0; i < starsCount * 3; i += 3) {
        const radius = 100 + Math.random() * 100;
        const u = Math.random(); const v = Math.random();
        const theta = u * 2.0 * Math.PI; const phi = Math.acos(2.0 * v - 1.0);
        starPositions[i] = radius * Math.sin(phi) * Math.cos(theta);
        starPositions[i+1] = radius * Math.sin(phi) * Math.sin(theta);
        starPositions[i+2] = radius * Math.cos(phi);
    }
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starField = new THREE.Points(starsGeometry, new THREE.PointsMaterial({ size: 0.8, color: 0x00ffff, transparent: true, opacity: 0.8 }));
    scene.add(starField);

    // Diseño del Puente de Magia Celeste
    const bridgeMat = new THREE.MeshStandardMaterial({ 
        color: 0x00bcff, emissive: 0x0033aa, emissiveIntensity: 2.0, transparent: true, opacity: 0.65 
    });
    const bridge = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 150), bridgeMat);
    bridge.rotation.x = -Math.PI / 2;
    bridge.position.set(0, -1.2, 0);
    scene.add(bridge);

    scene.add(new THREE.AmbientLight(0x0f0520, 0.6));
    const monsterAura = new THREE.PointLight(0xff00ff, 4, 10);
    scene.add(monsterAura);
    const loader = new THREE.GLTFLoader();
    let playerMesh = null; let monsterMesh = null;
    let playerMixer = null; let monsterMixer = null;
    const clock = new THREE.Clock();

    // Traer jugador (player.glb) y añadirle la linterna al frente
    loader.load('player.glb', function(gltf) {
        playerMesh = gltf.scene;
        playerMesh.position.set(0, -1.2, 2.5);
        playerMesh.rotation.y = Math.PI; 
        playerMesh.scale.set(0.7, 0.7, 0.7);
        scene.add(playerMesh);

        // Foco de la linterna frontal
        const flashlight = new THREE.SpotLight(0xffffff, 6, 20, Math.PI / 6, 0.5, 1);
        flashlight.position.set(0, 0.6, 0);
        const targetObj = new THREE.Object3D();
        targetObj.position.set(0, 0.6, 8);
        playerMesh.add(targetObj);
        flashlight.target = targetObj;
        playerMesh.add(flashlight);

        if(gltf.animations.length > 0) {
            playerMixer = new THREE.AnimationMixer(playerMesh);
            playerMixer.clipAction(gltf.animations).play();
        }
    });

    // Traer al monstruo persecutor (monster.glb)
    loader.load('monster.glb', function(gltf) {
        monsterMesh = gltf.scene;
        monsterMesh.scale.set(0.7, 0.7, 0.7);
        scene.add(monsterMesh);

        if(gltf.animations.length > 0) {
            monsterMixer = new THREE.AnimationMixer(monsterMesh);
            monsterMixer.clipAction(gltf.animations).play();
        }
        updatePositions();
    }, undefined, function(e) {
        // Objeto de respaldo si falla la carga local por CORS
        monsterMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshStandardMaterial({color: 0x4a0082}));
        scene.add(monsterMesh);
        updatePositions();
    });
    let enemyDistance = 8.0;
    let survivalTime = 0;
    let gameActive = false;

    function updatePositions() {
        if(playerMesh) playerMesh.position.set(0, -1.2, 2.0);
        if(monsterMesh) {
            monsterMesh.position.set(0, -1.2, 2.0 - enemyDistance);
            monsterAura.position.set(0, 0, 2.0 - enemyDistance);
        }
    }

    // Acción de las flechas superiores
    function moveCamera(dir) {
        if(!gameActive) return;
        if(dir === 'left') camera.position.x -= 0.4;
        if(dir === 'right') camera.position.x += 0.4;
        if(dir === 'up') camera.position.y += 0.4;
        if(dir === 'down') camera.position.y -= 0.4;
        camera.lookAt(0, -0.2, 1.5);
    }

    // Acción del botón del Rayo (Gana velocidad y aleja al monstruo)
    function useSpeedBoost() {
        if(!gameActive || enemyDistance <= 0) return;
        enemyDistance += 4.0;
        if(enemyDistance > 15.0) enemyDistance = 15.0;
    }

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('ui-layer').style.display = 'block';
        document.getElementById('directional-controls').style.display = 'flex';
        document.getElementById('speed-btn').style.display = 'flex';
        
        gameActive = true;
        bgMusic.play().catch(e => console.log("Audio play"));

        const logicInterval = setInterval(() => {
            if (!gameActive) { clearInterval(logicInterval); return; }
            
            let speed = 0.09 + (survivalTime * 0.002);
            enemyDistance -= speed;
            
            document.getElementById('distance').innerText = Math.max(0, enemyDistance).toFixed(1);
            updatePositions();

            if(enemyDistance <= 0.7) {
                gameActive = false;
                bgMusic.pause();
                jumpMusic.play().catch(e=>console.log(e));
                document.getElementById('jumpscare-screen').style.display = 'flex';
            }
        }, 100);

        const timeInterval = setInterval(() => {
            if (!gameActive) { clearInterval(timeInterval); return; }
            survivalTime++;
            document.getElementById('timer').innerText = survivalTime;

            if(survivalTime >= 60) {
                gameActive = false;
                bgMusic.pause();
                document.getElementById('win-screen').style.display = 'flex';
            }
        }, 1000);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (playerMixer) playerMixer.update(delta);
        if (monsterMixer) monsterMixer.update(delta);

        if (gameActive) {
            starField.rotation.y += 0.0004;
            bridgeMat.emissiveIntensity = 1.5 + Math.sin(performance.now() * 0.005) * 0.4;
        } else if (document.getElementById('jumpscare-screen').style.display === 'flex') {
            camera.position.x += (Math.random() - 0.5) * 0.15;
            camera.position.y += (Math.random() - 0.5) * 0.15;
        }
        renderer.render(scene, camera);
    }
    animate();
</script>
